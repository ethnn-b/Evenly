<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#1e1e1e"/></marker></defs>
<rect x="0" y="0" width="1120" height="430" fill="#ffffff"/>
<text x="20" y="32" font-size="20" text-anchor="start" fill="#1e1e1e" font-weight="bold">Evenly  ·  AI expense suggestions</text>

<!-- inputs (browser) -->
<rect x="40" y="86" width="250" height="54" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
<text x="165.0" y="117.0" font-size="15" text-anchor="middle" fill="#1e1e1e">Receipt photo &#8594; OCR text</text>
<rect x="40" y="150" width="250" height="54" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
<text x="165.0" y="181.0" font-size="15" text-anchor="middle" fill="#1e1e1e">Quick add: a sentence</text>
<text x="40" y="228" font-size="12" text-anchor="start" fill="#868e96">captured in the browser</text>
<text x="40" y="244" font-size="12" text-anchor="start" fill="#868e96">(Tesseract OCR / typed)</text>

<!-- client wrapper -->
<rect x="340" y="106" width="230" height="92" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/>
<text x="455.0" y="140.0" font-size="15" text-anchor="middle" fill="#1e1e1e">Client wrapper</text>
<text x="455.0" y="166.0" font-size="12" text-anchor="middle" fill="#868e96">suggestExpense / parseExpense</text>

<!-- route handler -->
<rect x="620" y="106" width="250" height="92" rx="10" fill="#e7f5ff" stroke="#4dabf7" stroke-width="2"/>
<text x="745.0" y="134.0" font-size="15" text-anchor="middle" fill="#1e1e1e">Route handler (Vercel)</text>
<text x="745.0" y="156.0" font-size="12" text-anchor="middle" fill="#1e1e1e">/api/suggest-expense</text>
<text x="745.0" y="174.0" font-size="12" text-anchor="middle" fill="#1e1e1e">/api/parse-expense</text>

<!-- groq -->
<rect x="910" y="106" width="170" height="92" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
<text x="995.0" y="140.0" font-size="16" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Groq</text>
<text x="995.0" y="162.0" font-size="12" text-anchor="middle" fill="#1e1e1e">open-weight LLM</text>
<text x="995.0" y="180.0" font-size="12" text-anchor="middle" fill="#868e96">(JSON mode)</text>

<!-- outputs -->
<rect x="340" y="300" width="230" height="86" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
<text x="455.0" y="328.0" font-size="14" text-anchor="middle" fill="#1e1e1e">Fallback (browser)</text>
<text x="455.0" y="350.0" font-size="12" text-anchor="middle" fill="#1e1e1e">heuristic name &#183; regex total</text>
<text x="455.0" y="368.0" font-size="12" text-anchor="middle" fill="#1e1e1e">quick-add: fill by hand</text>

<rect x="620" y="300" width="460" height="86" rx="10" fill="#ebfbee" stroke="#40c057" stroke-width="2"/>
<text x="850.0" y="328.0" font-size="15" text-anchor="middle" fill="#1e1e1e">Prefilled form fields</text>
<text x="850.0" y="350.0" font-size="12" text-anchor="middle" fill="#1e1e1e">receipt &#8594; name &#183; category &#183; total</text>
<text x="850.0" y="368.0" font-size="12" text-anchor="middle" fill="#1e1e1e">quick add &#8594; description &#183; amount &#183; payer &#183; members</text>

<!-- arrows -->
<polyline points="290,113 340,140" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="290,177 340,164" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="570,146 620,146" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<text x="595" y="138" font-size="11" text-anchor="middle" fill="#364fc7">POST</text>
<polyline points="870,138 910,138" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<text x="890" y="130" font-size="11" text-anchor="middle" fill="#364fc7">prompt</text>
<polyline points="910,168 870,168" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<text x="890" y="188" font-size="11" text-anchor="middle" fill="#364fc7">JSON</text>
<polyline points="455,198 455,300" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<text x="462" y="252" font-size="11" text-anchor="start" fill="#364fc7">no key / error</text>
<polyline points="745,198 745,300" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<text x="752" y="252" font-size="11" text-anchor="start" fill="#364fc7">validated &#8594; fields</text>

<text x="40" y="416" font-size="12" text-anchor="start" fill="#868e96">Routes run server-side (the API key never reaches the browser) and require a logged-in session. With no key set, the app uses the browser fallback.</text>
</svg>
