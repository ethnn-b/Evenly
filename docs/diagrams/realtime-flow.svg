<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 550" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#1e1e1e"/></marker><marker id="ahg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="1170" height="550" fill="#ffffff"/>
<text x="20" y="34" font-size="20" text-anchor="start" fill="#1e1e1e" font-weight="bold">Evenly  ·  realtime + settle-up flow</text>
<rect x="40" y="60" width="210" height="66" rx="10" fill="#e7f5ff" stroke="#4dabf7" stroke-width="2"/>
<text x="145.0" y="89.0" font-size="15" text-anchor="middle" fill="#1e1e1e">User A (browser)</text><text x="145.0" y="108.0" font-size="15" text-anchor="middle" fill="#1e1e1e">add expense / mark paid</text>
<rect x="470" y="60" width="220" height="66" rx="10" fill="#ebfbee" stroke="#40c057" stroke-width="2"/>
<text x="580.0" y="89.0" font-size="15" text-anchor="middle" fill="#1e1e1e">Supabase Postgres</text><text x="580.0" y="108.0" font-size="15" text-anchor="middle" fill="#1e1e1e">insert (RLS checked)</text>
<rect x="470" y="210" width="220" height="60" rx="10" fill="#ebfbee" stroke="#40c057" stroke-width="2"/>
<text x="580.0" y="236.0" font-size="15" text-anchor="middle" fill="#1e1e1e">Realtime</text><text x="580.0" y="255.0" font-size="15" text-anchor="middle" fill="#1e1e1e">(supabase_realtime pub)</text>
<rect x="880" y="60" width="210" height="66" rx="10" fill="#e7f5ff" stroke="#4dabf7" stroke-width="2"/>
<text x="985.0" y="98.5" font-size="15" text-anchor="middle" fill="#1e1e1e">User B (browser)</text>
<rect x="870" y="205" width="230" height="70" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/>
<text x="985.0" y="236.0" font-size="15" text-anchor="middle" fill="#1e1e1e">RealtimeRefresher</text><text x="985.0" y="255.0" font-size="15" text-anchor="middle" fill="#1e1e1e">→ router.refresh()</text>
<rect x="840" y="330" width="290" height="88" rx="10" fill="#e7f5ff" stroke="#4dabf7" stroke-width="2"/>
<text x="985.0" y="360.5" font-size="15" text-anchor="middle" fill="#1e1e1e">Server Component</text><text x="985.0" y="379.5" font-size="15" text-anchor="middle" fill="#1e1e1e">recompute balances</text><text x="985.0" y="398.5" font-size="15" text-anchor="middle" fill="#1e1e1e">(computeBalances + settle)</text>
<rect x="840" y="450" width="290" height="60" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
<text x="985.0" y="476.0" font-size="15" text-anchor="middle" fill="#1e1e1e">UI updates live</text><text x="985.0" y="495.0" font-size="15" text-anchor="middle" fill="#1e1e1e">(debt clears on settle)</text>
<polyline points="250,93 470,93" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<text x="300" y="77" font-size="12" text-anchor="start" fill="#364fc7">1. write</text>
<polyline points="580,126 580,210" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<text x="590" y="166" font-size="12" text-anchor="start" fill="#364fc7">2. WAL change</text>
<polyline points="690,240 870,240" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<text x="693" y="189" font-size="12" text-anchor="start" fill="#364fc7">3. postgres_changes</text><text x="693" y="205" font-size="12" text-anchor="start" fill="#364fc7">over WebSocket (authed)</text>
<polyline points="985,205 985,127" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ahg)"/>
<text x="995" y="161" font-size="12" text-anchor="start" fill="#364fc7">in User B&#x27;s</text><text x="995" y="177" font-size="12" text-anchor="start" fill="#364fc7">browser</text>
<polyline points="985,275 985,330" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<text x="995" y="303" font-size="12" text-anchor="start" fill="#364fc7">4. refetch</text>
<polyline points="985,418 985,450" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<text x="40" y="312" font-size="13" text-anchor="start" fill="#868e96">Balances = sum(paid) − sum(owed).</text><text x="40" y="329" font-size="13" text-anchor="start" fill="#868e96">Settlements fold in like an expense</text><text x="40" y="346" font-size="13" text-anchor="start" fill="#868e96">(payer credited, receiver debited),</text><text x="40" y="363" font-size="13" text-anchor="start" fill="#868e96">so a recorded payment drives the</text><text x="40" y="380" font-size="13" text-anchor="start" fill="#868e96">balance to zero. router.refresh()</text><text x="40" y="397" font-size="13" text-anchor="start" fill="#868e96">re-runs the server component, which</text><text x="40" y="414" font-size="13" text-anchor="start" fill="#868e96">recomputes from the fresh rows.</text>
</svg>
